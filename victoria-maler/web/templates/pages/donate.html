{{ define "donate" }}
<main class="container" style="padding:24px 20px">
  <h2>Donate</h2>
  <p>Your contribution helps local groups purchase equipment and organize cleanups.</p>

  <section style="margin-top:16px" class="form-card">
    <form id="donate-form">
      <label>Campaign</label>
      <select name="campaign_id" required>
        {{ range .Campaigns }}
          <option value="{{ .ID }}">{{ .Title }}</option>
        {{ end }}
      </select>
      <label>Your name</label>
      <input type="text" name="donor_name">
      <label>Amount (USD)</label>
      <input type="number" name="amount" min="0.01" step="0.01" placeholder="10.00" required>
      <label>Message (optional)</label>
      <textarea name="message" rows="2"></textarea>
      <button class="btn btn-primary" type="submit">Donate</button>
    </form>
    <p id="donate-msg" class="form-msg"></p>
  </section>
</main>
<script src="/static/js/donate.js"></script>
{{ end }}
