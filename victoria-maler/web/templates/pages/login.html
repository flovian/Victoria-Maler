{{ define "content" }}
<main class="container" style="padding:24px 20px;max-width:480px">
  <h2>Login</h2>
  <form>
    <label>Email</label><br>
    <input type="email" style="width:100%;padding:10px;margin-top:8px;border:1px solid #e6f0ff;border-radius:6px"><br>
    <label style="margin-top:12px;display:block">Password</label>
    <input type="password" style="width:100%;padding:10px;margin-top:8px;border:1px solid #e6f0ff;border-radius:6px"><br>
    <button class="btn btn-primary" style="margin-top:14px">Login</button>
  </form>
</main>
{{ end }}
