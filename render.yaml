services:
  - type: web
    name: victoria-maler
    runtime: go
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: BITCOIN_ENABLED
        value: "false"
      - key: DB_PATH
        value: /var/data/database.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
